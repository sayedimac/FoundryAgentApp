# Docs for the Azure Functions Deploy action: https://github.com/Azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy WeatherFunctionApp to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'WeatherFunctionApp/**'
      - '.github/workflows/main_weatherfunctionapp.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'WeatherFunctionApp'
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build with dotnet
        run: dotnet build "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" --configuration Release

      - name: dotnet publish
        run: dotnet publish "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" -c Release -o "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: weather-function-app
          path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: weather-function-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CA50767D64064152AFBB5652E83D5A62 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8BE307492E3A4392AEB4EEBCAADA9A92 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7BFB30B28EBF44C78B9620AE1B388309 }}

      - name: Deploy to Azure Functions
        id: deploy-to-function
        uses: Azure/functions-action@v1
        with:
          app-name: 'weatherfunctionapp'
          slot-name: 'Production'
          package: .
