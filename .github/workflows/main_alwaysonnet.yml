jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish -c Release -o "$DOTNET_ROOT/myapp"

      - name: Run Foundry Agent/LLM Evaluation
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: "https://johan-test-resource.services.ai.azure.com/api/projects/johan-test"
          deployment-name: "gpt-4.1"
          agent-ids: "test-agent-1:v1"
          data-path: "${{ github.workspace }}/testdata/eval.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: "$DOTNET_ROOT/myapp"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E7205144BBDF4E59A9F5E1D9850E9F00 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EEC112F5AC124242B7D74482E899F7FB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_998B8782491E457C9CE85B4CE0933910 }}
